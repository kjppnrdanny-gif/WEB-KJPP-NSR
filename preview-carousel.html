<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlexCarousel &mdash; KJPP Nanang Rahayu &amp; Rekan</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="components/FlexCarousel.css">
  <style>
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100 overflow-hidden">

  <!-- Minimal Top Bar -->
  <header class="absolute top-0 left-0 right-0 z-50 p-4 flex items-center justify-between pointer-events-none">
    <a href="index.html#galeri" class="pointer-events-auto text-xs text-slate-400 hover:text-white transition-colors bg-slate-900/60 backdrop-blur-md px-3 py-1.5 rounded-lg border border-slate-800">
      &larr; Beranda
    </a>
  </header>

  <!-- Fullscreen FlexCarousel Element -->
  <main class="flex-1 w-full h-screen relative">
    <div id="flex-carousel-preview" class="w-full h-full absolute inset-0"></div>
  </main>

  <script src="lib/flex-carousel.bundle.js"></script>
  <script>
    const KJPP_ITEMS = [
      {
        src: 'images/kegiatan/inspeksi/IMG_20240827_095920.jpg',
        title: 'Musyawarah Ganti Kerugian Tol Sigli - Banda Aceh',
        subtitle: 'PSN Jalan Tol & Kementerian ATR/BPN'
      },
      {
        src: 'images/kegiatan/inspeksi/IMG_20230525_114736.jpg',
        title: 'Rakor Percepatan Tol Akses Menuju IKN',
        subtitle: 'IKN Kaltim & Kementerian PUPR'
      },
      {
        src: 'images/kegiatan/inspeksi/84871D33-97F0-40E8-8793-BABAF09428C7.jpg',
        title: 'Inspeksi Fisik Armada Bus PT Aerotrans Services',
        subtitle: 'Valuasi Mesin & Aset Transportasi'
      },
      {
        src: 'images/kegiatan/inspeksi/IMG_20200205_160435.jpg',
        title: 'Inspeksi Lapangan Properti Komersial & Industri',
        subtitle: 'Penilaian Properti Real Estate'
      },
      {
        src: 'images/kegiatan/inspeksi/IMG_20221119_153708.jpg',
        title: 'Survei Topografi & Batas Fisik Lahan Proyek',
        subtitle: 'Dokumentasi GPS & Pengukuran Lapangan'
      },
      {
        src: 'images/kegiatan/diklat/IMG_20200314_093637.jpg',
        title: 'Pendidikan Profesi Penilai MAPPI & Legal SPI',
        subtitle: 'Peningkatan Kompetensi Berkelanjutan'
      },
      {
        src: 'images/kegiatan/diklat/PKP SPI 204.jpg',
        title: 'Pelatihan Sertifikasi Kode Etik Penilai Indonesia (KEPI)',
        subtitle: 'Standar Penilaian Indonesia (SPI)'
      },
      {
        src: 'images/kegiatan/kemitraan/IMG_20231206_120928.jpg',
        title: 'Audiensi Mitra Perbankan & Lembaga Keuangan',
        subtitle: 'Valuasi Agunan & Jaminan Kredit'
      },
      {
        src: 'images/kegiatan/gathering.jpg',
        title: 'Gathering Akbar Tahunan Seluruh Tim KJPP NSR',
        subtitle: 'Pantai Pangandaran, Jawa Barat'
      },
      {
        src: 'images/kegiatan/gathering (2).jpg',
        title: 'Team Building & Soliditas Rekan Penilai',
        subtitle: 'Green Canyon Cijulang & Outbound'
      },
      {
        src: 'images/kegiatan/raker/20141122_161954.jpg',
        title: 'Temu Akrab & Rapat Kerja Tahunan KJPP NSR',
        subtitle: 'Konsolidasi & Evaluasi Mutu Nasional'
      },
      {
        src: 'images/kegiatan/kantor cabang padang.jpg',
        title: 'Operasional Kantor Cabang Padang, Sumbar',
        subtitle: 'Jaringan Pelayanan Penilaian Nasional'
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('flex-carousel-preview');
      if (!container || !window.initFlexCarousel) return;

      window.carouselInstance = window.initFlexCarousel(container, {
        items: KJPP_ITEMS,
        preset: 'liquid',
        intro: 'rise',
        fit: 'natural',
        cardHeight: 0.5,
        gap: 12,
        radius: 0,
        lensWidth: 0.89,
        lensHeight: 1.18,
        tilt: 62,
        roundness: 0.71,
        bend: 0.07,
        reach: 0.38,
        curl: 'twist',
        dispersion: 0.45,
        liquid: 0,
        followCursor: false,
        squeeze: 0.2,
        focusOnClick: true,
        autoplay: false,
        interval: 4,
        captions: true,
        captureWheel: true
      });
    });
  </script>
</body>
</html>
