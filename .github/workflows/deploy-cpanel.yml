name: Deploy ke cPanel KJPP NSR

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulasi pengujian tanpa mengubah server (true / false)'
        required: false
        default: 'false'
      rollback_sha:
        description: 'Commit SHA untuk rollback (opsional, kosongkan untuk deploy commit HEAD)'
        required: false
        default: ''

jobs:
  web-deploy:
    name: Deploy Website to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Ambil Kode Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_sha != '' && github.event.inputs.rollback_sha || github.ref }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Build Website Publik ke dist/ (Proteksi Portal cPanel)
        run: node scripts/build-production.mjs --cpanel

      - name: 💾 Simpan Snapshot Cadangan Deployment (Rollback Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-snapshot-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: 📥 Cadangkan public_html/index.html langsung dari Filesystem cPanel via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 -c "
          import ftplib, ssl, os, sys, time, hashlib
          server = os.environ['FTP_SERVER']
          user = os.environ['FTP_USERNAME']
          passwd = os.environ['FTP_PASSWORD']
          backup_file = 'cpanel_filesystem_backup_index.html'
          max_retries = 3
          timeout_sec = 45
          success = False

          for attempt in range(1, max_retries + 1):
              print(f'🔄 [Percobaan {attempt}/{max_retries}] Mengambil backup filesystem cPanel via FTPS (timeout={timeout_sec}s)...')
              try:
                  context = ssl.create_default_context()
                  ftps = ftplib.FTP_TLS(context=context, timeout=timeout_sec)
                  ftps.connect(server)
                  ftps.login(user, passwd)
                  ftps.prot_p()
                  try:
                      files_in_root = ftps.nlst()
                      if 'public_html' in files_in_root:
                          ftps.cwd('public_html')
                  except Exception as e_dir:
                      print(f'   Catatan navigasi direktori: {e_dir}')
                  with open(backup_file, 'wb') as f:
                      ftps.retrbinary('RETR index.html', f.write)
                  ftps.quit()
                  if os.path.exists(backup_file) and os.path.getsize(backup_file) > 0:
                      with open(backup_file, 'rb') as f:
                          h = hashlib.sha256(f.read()).hexdigest()
                      print('✅ BERHASIL MENGAMBIL BACKUP FILESYSTEM CPANEL VIA FTPS')
                      print(f'   File: {backup_file}')
                      print(f'   Ukuran: {os.path.getsize(backup_file)} bytes')
                      print(f'   SHA256: {h}')
                      success = True
                      break
                  else:
                      raise Exception('File backup kosong (0 bytes) atau tidak terunduh.')
              except Exception as err:
                  print(f'⚠️ Gagal pada percobaan {attempt}: {err}')
                  if attempt < max_retries:
                      sleep_time = attempt * 5
                      print(f'   Menunggu {sleep_time} detik sebelum mencoba kembali...')
                      time.sleep(sleep_time)

          if not success:
              print('❌ FATAL: Seluruh percobaan backup filesystem live cPanel gagal!')
              print('   Sesuai Governance P0, proses deployment DIBATALKAN untuk melindungi integritas sistem live.')
              sys.exit(1)
          "

      - name: 💾 Upload Backup Filesystem cPanel ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-filesystem-backup-${{ github.sha }}
          path: cpanel_filesystem_backup_index.html
          retention-days: 30

      - name: 📂 Sinkronisasi File ke cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: public_html/
          dry-run: ${{ github.event.inputs.dry_run == 'true' }}
          dangerous-clean-slate: false
          exclude: |
            **/data/**
            **/visitor-data.json
            **/nolap-data.json
            **/README*.txt
            *.md
            package*.json
