name: Deploy ke cPanel KJPP NSR

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulasi pengujian tanpa mengubah server (true / false)'
        required: false
        default: 'false'
      rollback_sha:
        description: 'Commit SHA untuk rollback (opsional, kosongkan untuk deploy commit HEAD)'
        required: false
        default: ''

jobs:
  web-deploy:
    name: Deploy Website to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Ambil Kode Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_sha != '' && github.event.inputs.rollback_sha || github.ref }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Build Website Publik ke dist/ (Proteksi Portal cPanel)
        run: node scripts/build-production.mjs --cpanel

      - name: 💾 Simpan Snapshot Cadangan Deployment (Rollback Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-snapshot-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: 📥 Cadangkan public_html/index.html langsung dari Filesystem cPanel via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 -c "
          import ftplib, ssl, os, hashlib
          ftps = ftplib.FTP_TLS()
          ftps.connect(os.environ['FTP_SERVER'])
          ftps.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
          ftps.prot_p()
          files_in_root = ftps.nlst()
          if 'public_html' in files_in_root:
              ftps.cwd('public_html')
          with open('cpanel_filesystem_backup_index.html', 'wb') as f:
              ftps.retrbinary('RETR index.html', f.write)
          ftps.quit()
          with open('cpanel_filesystem_backup_index.html', 'rb') as f:
              h = hashlib.sha256(f.read()).hexdigest()
          print('✅ BERHASIL MENGAMBIL BACKUP FILESYSTEM CPANEL VIA FTPS')
          print(f'   Ukuran: {os.path.getsize(\"cpanel_filesystem_backup_index.html\")} bytes')
          print(f'   SHA256: {h}')
          "

      - name: 💾 Upload Backup Filesystem cPanel ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-filesystem-backup-${{ github.sha }}
          path: cpanel_filesystem_backup_index.html
          retention-days: 30

      - name: 📂 Sinkronisasi File ke cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: public_html/
          dry-run: ${{ github.event.inputs.dry_run == 'true' }}
          dangerous-clean-slate: false
          exclude: |
            portal-nolap.html
            portal-kwitansi.html
            **/portal-nolap.html
            **/portal-kwitansi.html
            **/visitor-data.json
            **/README*.txt
            *.md
            package*.json
