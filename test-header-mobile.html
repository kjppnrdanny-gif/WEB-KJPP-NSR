<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Header Mobile Proporsional</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 p-4">

  <div class="max-w-[390px] mx-auto bg-slate-950 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl">
    
    <!-- Bar 1: Top Bar -->
    <div class="bg-gradient-to-r from-blue-950 via-slate-950 to-blue-950 text-white text-[10px] py-1 px-3 text-center border-b border-blue-900/60">
      <span class="text-amber-400 font-bold">LEGALITAS RESMI</span> &bull; Izin Kemenkeu No. 2.19.0160
    </div>

    <!-- Bar 2: Bar Kop Surat (Proporsional) -->
    <div class="border-b border-slate-200 bg-white">
      <div class="px-2.5 sm:px-6 py-2 sm:py-3.5 flex items-center justify-between gap-1.5 sm:gap-4">
        
        <!-- Identitas Kantor Kop Surat -->
        <a href="#profil" class="flex items-center gap-1.5 sm:gap-3 min-w-0 flex-1">
          <!-- Logo NSR -->
          <svg class="h-[28px] sm:h-12 w-auto shrink-0 drop-shadow-sm" viewBox="0 0 160 55" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="nsrBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2563eb" />
                <stop offset="50%" stop-color="#1d4ed8" />
                <stop offset="100%" stop-color="#0b1b4f" />
              </linearGradient>
              <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#ef4444" flood-opacity="0.9"/>
              </filter>
            </defs>
            <text x="4" y="44" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="50" letter-spacing="1" fill="none" stroke="#ef4444" stroke-width="7" stroke-linejoin="round" filter="url(#neonGlow)">NSR</text>
            <text x="4" y="44" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="50" letter-spacing="1" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round">NSR</text>
            <text x="4" y="44" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="50" letter-spacing="1" fill="url(#nsrBlue)">NSR</text>
          </svg>

          <!-- Teks Kop Surat -->
          <div class="leading-tight text-left min-w-0 flex-1">
            <span class="block text-[8.5px] sm:text-xs md:text-[13px] font-bold text-[#c00000] tracking-tight leading-tight truncate">
              Kantor Jasa Penilai Publik (KJPP)
            </span>
            <span class="block text-[10px] sm:text-sm md:text-base lg:text-[17px] font-black text-[#002060] uppercase tracking-tight leading-[1.15] line-clamp-2 sm:line-clamp-none">
              NANANG RAHAYU SIGIT PARYANTO DAN REKAN
            </span>
            <span class="block text-[7.5px] sm:text-xs md:text-[13px] italic font-semibold text-[#c00000] tracking-tight leading-tight truncate">
              Licensed Public Appraisers &amp; Consultants
            </span>
          </div>
        </a>

        <!-- Tombol Portal Internal Mobile (Kompak & Elegan) -->
        <button type="button" onclick="alert('Portal Internal Modal')" 
          class="shrink-0 inline-flex items-center gap-1.5 px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-xl bg-gradient-to-r from-amber-400 via-amber-300 to-yellow-400 hover:from-amber-300 hover:to-yellow-300 text-slate-950 border border-amber-300/90 shadow-sm active:scale-95 transition cursor-pointer" 
          aria-label="Buka Portal Internal" title="Portal Internal KJPP NSR">
          <div class="relative flex items-center justify-center shrink-0">
            <svg class="w-3.5 h-3.5 text-slate-950 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span class="absolute -top-1 -right-1 flex h-1.5 w-1.5">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-600 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-700"></span>
            </span>
          </div>
          <div class="text-left leading-none shrink-0">
            <span class="block text-[7.5px] font-black tracking-wider uppercase text-slate-800">PORTAL</span>
            <span class="block text-[9px] font-black tracking-tight uppercase text-slate-950">INTERNAL</span>
          </div>
        </button>

      </div>
    </div>

    <!-- Bar 3: Bar Navigasi Bawah -->
    <div class="bg-slate-950 border-t border-slate-800 text-white px-2.5 py-2 flex items-center justify-between gap-1.5">
      <button class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-gradient-to-r from-blue-900 to-slate-900 text-white border border-blue-700/70 text-[11px] font-bold shrink-0">
        <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span class="text-amber-300 font-extrabold">PILIHAN MENU</span>
      </button>

      <div class="flex items-center gap-1 overflow-x-auto no-scrollbar text-[10.5px]">
        <span class="px-2 py-1 rounded bg-slate-900 border border-slate-800">Profil</span>
        <span class="px-2 py-1 rounded bg-slate-900 border border-slate-800">Layanan</span>
        <span class="px-2 py-1 rounded bg-slate-900 border border-slate-800">Rekan</span>
        <span class="px-2 py-1 rounded bg-slate-900 border border-slate-800">Portofolio</span>
        <span class="px-2 py-1 rounded bg-amber-400 text-slate-950 font-bold">Kontak</span>
      </div>
    </div>

  </div>

</body>
</html>
