<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 55" width="200" height="55" fill="none">
  <!-- Balai Lelang Batavia Official Vector -->
  <g transform="translate(8, 7)">
    <!-- Medallion Shield Background -->
    <rect x="0" y="2" width="36" height="36" rx="8" fill="#0A192F" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="18" cy="20" r="14" fill="#112240"/>
    <!-- Gavel / Auction Hammer Symbol -->
    <g transform="rotate(-35 18 20)">
      <!-- Gavel Head -->
      <rect x="13" y="11" width="10" height="6" rx="1.5" fill="#D4AF37"/>
      <!-- Gavel Handle -->
      <rect x="16.5" y="16" width="3" height="12" rx="1" fill="#F3E5AB"/>
      <!-- Gavel Base block -->
      <path d="M 8,28 L 28,28 L 26,30 L 10,30 Z" fill="#D4AF37"/>
    </g>
  </g>
  <g transform="translate(52, 9)">
    <text x="0" y="14" font-family="'Inter', 'Arial Black', sans-serif" font-size="8.5" font-weight="800" fill="#B8860B" letter-spacing="1.5">BALAI LELANG</text>
    <text x="0" y="29" font-family="'Inter', 'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#0A192F" letter-spacing="1">BATAVIA</text>
    <text x="0" y="38" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#64748B" letter-spacing="0.5">LELANG SWASTA NASIONAL</text>
  </g>
</svg>
