  <text x="97" y="87" font-family="'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', Arial, sans-serif" font-weight="600" font-size="13.2" letter-spacing="0.35" fill="#334155">PT JASA DAN KEPARIWISATAAN JABAR (PERSERODA)</text>
