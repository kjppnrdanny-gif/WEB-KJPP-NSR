<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 55" width="200" height="55" fill="none">
  <!-- BPR Hasta Mulya Official Vector -->
  <g transform="translate(8, 7)">
    <!-- Banking Diamond/Shield Crest -->
    <rect x="0" y="2" width="36" height="36" rx="8" fill="#1E3A8A"/>
    <!-- Inner geometric emblem representing pillars & stability -->
    <path d="M 18,6 L 31,13 L 31,27 L 18,34 L 5,27 L 5,13 Z" stroke="#F59E0B" stroke-width="1.8" fill="#1E40AF"/>
    <path d="M 18,10 L 26,14.5 L 26,24.5 L 18,29 L 10,24.5 L 10,14.5 Z" fill="#F59E0B"/>
    <!-- Central Monogram H -->
    <path d="M 14,16 L 14,24 M 22,16 L 22,24 M 14,20 L 22,20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(52, 9)">
    <text x="0" y="16" font-family="'Inter', 'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#1E3A8A" letter-spacing="1">BPR</text>
    <text x="32" y="16" font-family="'Inter', 'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#D97706" letter-spacing="0.5">HASTA MULYA</text>
    <text x="0" y="28" font-family="'Inter', 'Arial', sans-serif" font-size="10" font-weight="800" fill="#0F172A" letter-spacing="0.5">SURAKARTA</text>
    <text x="0" y="38" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#64748B" letter-spacing="0.5">BANK PEREKONOMIAN RAKYAT</text>
  </g>
</svg>
