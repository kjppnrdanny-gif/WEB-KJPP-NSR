[build]
  command = "node scripts/build-production.mjs"
  publish = "dist"
  functions = "netlify/functions"


[[redirects]]
  from = "/portal-agenda-su.html"
  to = "/portal-surat-umum.html"
  status = 200

[[redirects]]
  from = "/portal-agenda-su"
  to = "/portal-surat-umum.html"
  status = 200

[[redirects]]
  from = "/agenda-su"
  to = "/portal-surat-umum.html"
  status = 200

# Routing API Serverless Functions
[[redirects]]
  from = "/api/auth-login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth-verify"
  to = "/.netlify/functions/auth-verify"
  status = 200

[[redirects]]
  from = "/api/auth-logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/api/nolap-data-proxy"
  to = "/.netlify/functions/nolap-data-proxy"
  status = 200

[[redirects]]
  from = "/api/kwitansi-data-proxy"
  to = "/.netlify/functions/kwitansi-data-proxy"
  status = 200

[[redirects]]
  from = "/api/surat-umum-data-proxy"
  to = "/.netlify/functions/surat-umum-data-proxy"
  status = 200

[[redirects]]
  from = "/api/absensi-data-proxy"
  to = "/.netlify/functions/absensi-data-proxy"
  status = 200

[[redirects]]
  from = "/api/status-terintegrasi-proxy"
  to = "/.netlify/functions/status-terintegrasi-proxy"
  status = 200

# Pengalihan URL PDF Lama ke Dokumen Resmi Terbaru (Cegah Dokumen Lama Pribadi Tersaji)
[[redirects]]
  from = "/Company%20Profile%20KJPP%20NSR%202026_S.pdf"
  to = "/company-profile-kjpp-nsr-2026.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/Company-Profile-KJPP-NSR-2026_S.pdf"
  to = "/company-profile-kjpp-nsr-2026.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/Company Profile KJPP NSR 2026_S.pdf"
  to = "/company-profile-kjpp-nsr-2026.pdf"
  status = 301
  force = true

# Proteksi Direktori Data & Master Backend (Cegah Kebocoran Master/Spreadsheet ID/Personel)
[[redirects]]
  from = "/data/*"
  to = "/index.html"
  status = 404
  force = true

# Proteksi Fallback Akses Internal
[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/scratch/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/screenshots/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/staging-*/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/company-profile-kjpp-nsr-2026.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
