      img.style.display = 'none';

    // 2. Kontrol Modal Universal (CV, Regulasi, RFP, Portal)
    function bukaModal(id) {
      const el = document.getElementById(id);
      if (el) {
        elemenFokusSebelumnya = document.activeElement;
        el.classList.remove('hidden');
        el.setAttribute('aria-hidden', 'false');
        document.body.classList.add('overflow-hidden');
        requestAnimationFrame(() => {
          const fokus = el.querySelector('input, select, textarea, button, a[href]');
          fokus?.focus({ preventScroll: true });
        });
      }
    }

    function tutupModal(id) {
      const el = document.getElementById(id);
      if (el) {
        el.classList.add('hidden');
        el.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('overflow-hidden');
        if (elemenFokusSebelumnya && typeof elemenFokusSebelumnya.focus === 'function') {
          elemenFokusSebelumnya.focus({ preventScroll: true });
        }
      }
    }

      const email = 'nanang_kjpp@yahoo.co.id';

        }).catch(() => fallbackSalinEmail(email, btn));
      } else {
        fallbackSalinEmail(email, btn);
      }
    }
    function fallbackSalinEmail(text, btn) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      tampilkanFeedbackSalin(btn);
    }

    function filterWarta(kategori, btn) {
      const cards = document.querySelectorAll('.card-warta');
      const buttons = document.querySelectorAll('.btn-filter-warta');
      const toggleBox = document.getElementById('warta-toggle-box');
      buttons.forEach(b => {
        b.className = 'btn-filter-warta px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition';
      });
      if (btn) {
        btn.className = 'btn-filter-warta px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-400 text-slate-950 shadow transition';
      }
      
      let visibleCount = 0;
      const isExpanded = document.getElementById('txt-toggle-extra-warta') && 
                         document.getElementById('txt-toggle-extra-warta').textContent.includes('Sembunyikan');

      if (kategori === 'semua') {
        if (toggleBox) toggleBox.classList.remove('hidden');
        cards.forEach(card => {
          if (!card.classList.contains('card-warta-extra') || isExpanded) {
            card.classList.remove('hidden');
            visibleCount++;
          } else {
            card.classList.add('hidden');
          }
        });
      } else {
        if (toggleBox) toggleBox.classList.add('hidden');
        cards.forEach(card => {
          if (card.classList.contains('item-warta-' + kategori)) {
            card.classList.remove('hidden');
            visibleCount++;
          } else {
            card.classList.add('hidden');
          }
        });
      }

      const emptyEl = document.getElementById('wawasan-empty-state');
      if (emptyEl) {
        if (visibleCount === 0) {
          emptyEl.classList.remove('hidden');
        } else {
          emptyEl.classList.add('hidden');
        }
      }
    }

    function cariArtikelWawasan(query) {
      const q = (query || '').toLowerCase().trim();
      const cards = document.querySelectorAll('.card-warta');
      const btnReset = document.getElementById('btn-reset-cari');
      const emptyEl = document.getElementById('wawasan-empty-state');
      const toggleBox = document.getElementById('warta-toggle-box');

      if (btnReset) {
        if (q.length > 0) {
          btnReset.classList.remove('hidden');
        } else {
          btnReset.classList.add('hidden');
        }
      }

      let count = 0;
      if (q.length > 0) {
        if (toggleBox) toggleBox.classList.add('hidden');
        cards.forEach(card => {
          const text = card.textContent.toLowerCase();
          const kw = (card.getAttribute('data-keywords') || '').toLowerCase();
          if (text.includes(q) || kw.includes(q)) {
            card.classList.remove('hidden');
            count++;
          } else {
            card.classList.add('hidden');
          }
        });
      } else {
        if (toggleBox) toggleBox.classList.remove('hidden');
        const isExpanded = document.getElementById('txt-toggle-extra-warta') && 
                           document.getElementById('txt-toggle-extra-warta').textContent.includes('Sembunyikan');
        cards.forEach(card => {
          if (!card.classList.contains('card-warta-extra') || isExpanded) {
            card.classList.remove('hidden');
            count++;
          } else {
            card.classList.add('hidden');
          }
        });
      }

      if (emptyEl) {
        if (count === 0) {
          emptyEl.classList.remove('hidden');
        } else {
          emptyEl.classList.add('hidden');
        }
      }
    }

    function setupMapLazyLoad() {
      const elIframe = document.getElementById('map-iframe-kantor');
      const cabangSection = document.getElementById('kontak') || document.getElementById('map-iframe-kantor');
      if (!elIframe || !cabangSection) return;

      const muatPeta = () => {
        if (!elIframe.src || elIframe.src === 'about:blank' || elIframe.src.indexOf('about:blank') !== -1) {
          elIframe.src = elIframe.getAttribute('data-src') || 'https://www.google.com/maps?q=KJPP+Nanang+Rahayu+Sigit+Paryanto+dan+Rekan&hl=id&z=17&output=embed';
        }
      };

      if ('IntersectionObserver' in window) {
        const obs = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting) {
            obs.disconnect();
            muatPeta();
          }
        }, { rootMargin: '350px 0px' });
        obs.observe(cabangSection);
      } else {
        muatPeta();
      }
    }

    function perbaruiTampilanGaleri() {
      const items = document.querySelectorAll('.item-galeri');
      const wrapToggle = document.getElementById('wrapper-toggle-galeri');
      const btnText = document.getElementById('btn-toggle-galeri-text');
      const btnIcon = document.getElementById('btn-toggle-galeri-icon');
      const infoJumlah = document.getElementById('info-jumlah-galeri');

      const itemCocok = [];
      items.forEach(item => {
        const itemKat = (item.getAttribute('data-kategori') || '').split(/\s+/);
        if (galeriKategoriAktif === 'semua' || itemKat.includes(galeriKategoriAktif)) {
          itemCocok.push(item);
        } else {
          item.classList.add('hidden');
        }
      });

      if (galeriKategoriAktif === 'semua') {
        const total = itemCocok.length;
        const sisa = Math.max(0, total - BATAS_AWAL_GALERI);
        if (!galeriTampilSemua) {
          itemCocok.forEach((item, idx) => {
            if (idx < BATAS_AWAL_GALERI) {
              item.classList.remove('hidden');
            } else {
              item.classList.add('hidden');
            }
          });
          if (wrapToggle) wrapToggle.classList.remove('hidden');
          if (btnText) btnText.innerText = 'Lihat Seluruh Dokumentasi (+' + sisa + ' Foto)';
          if (btnIcon) btnIcon.innerHTML = '&uarr;';
          if (infoJumlah) infoJumlah.innerText = 'Menampilkan ' + BATAS_AWAL_GALERI + ' dari ' + total + ' foto kegiatan operasional terpilih';
        } else {
          itemCocok.forEach(item => item.classList.remove('hidden'));
          if (wrapToggle) wrapToggle.classList.remove('hidden');
          if (btnText) btnText.innerText = 'Tampilkan Lebih Ringkas (' + BATAS_AWAL_GALERI + ' Foto Utama)';
          if (btnIcon) btnIcon.innerHTML = '&darr;';
          if (infoJumlah) infoJumlah.innerText = 'Menampilkan seluruh ' + total + ' foto kegiatan operasional';
        }
      } else {
        itemCocok.forEach(item => item.classList.remove('hidden'));
        if (wrapToggle) wrapToggle.classList.add('hidden');
      }
    }

    // 4. Form RFP (Minta Penawaran Biaya ke WA)
    function kirimFormRFP(e) {
      e.preventDefault();

      // Rate limiting: cegah spam — cooldown 90 detik
      const COOLDOWN_MS = 90000;
      const lastSent = parseInt(localStorage.getItem('nsr_rfp_last_sent') || '0', 10);
      const now = Date.now();
      if (now - lastSent < COOLDOWN_MS) {
        const sisaDetik = Math.ceil((COOLDOWN_MS - (now - lastSent)) / 1000);
        tampilkanToast(`Mohon tunggu ${sisaDetik} detik sebelum mengirim permohonan berikutnya.`);
        return;
      }

      const nama = document.getElementById('rfp-nama').value.trim();
      const instansi = document.getElementById('rfp-instansi').value.trim();
      const objek = document.getElementById('rfp-objek').value;
      const tujuan = document.getElementById('rfp-tujuan').value;
      const lokasi = document.getElementById('rfp-lokasi').value.trim();
      const wa = document.getElementById('rfp-wa').value.trim();

      if (!nama || !lokasi || !wa) {
        tampilkanToast('Harap lengkapi nama, lokasi, dan nomor WhatsApp.');
        return;
      }

      const email = document.getElementById('rfp-email') ? document.getElementById('rfp-email').value.trim() : '';
      const catatan = document.getElementById('rfp-catatan') ? document.getElementById('rfp-catatan').value.trim() : '';

      let pesan = `*PERMOHONAN PENAWARAN BIAYA (RFP) - KJPP NSR*\n\n` +
                  `*Nama PIC:* ${nama}\n` +
                  `*Instansi/Bank:* ${instansi || '-'}\n` +
                  `*Email:* ${email || '-'}\n` +
                  `*Objek Penilaian:* ${objek}\n` +
                  `*Tujuan:* ${tujuan}\n` +
                  `*Lokasi:* ${lokasi}\n` +
                  `*Kontak WhatsApp:* ${wa}\n`;
      if (catatan) {
        pesan += `*Uraian Kebutuhan:* ${catatan}\n`;
      }
      pesan += `\nMohon dapat dikirimkan surat penawaran biaya resmi dan persyaratan dokumen teknis. Terima kasih.`;

      localStorage.setItem('nsr_rfp_last_sent', now.toString());
      tampilkanToast('RFP siap dikirim melalui WhatsApp.');
      window.open(`https://wa.me/6285110513157?text=${encodeURIComponent(pesan)}`, '_blank', 'noopener,noreferrer');
      tutupModal('modal-rfp');
    }

    function filterGridRekanan() {
      const q = (document.getElementById('cari-rekanan-page')?.value || '').toLowerCase().trim();
      const cardItems = document.querySelectorAll('.rekanan-card-item');
      const tableRows = document.querySelectorAll('.rekanan-table-row');
      const expBar = document.getElementById('rekanan-expand-bar');
      let visibleCount = 0;

      // Filter Cards
      cardItems.forEach((card, idx) => {
        const cKat = card.getAttribute('data-kat') || '';
        const cNama = card.getAttribute('data-nama') || '';
        const cSubkat = card.getAttribute('data-subkat') || '';

        const cocokKat = (katRekananAktif === 'semua' || cKat === katRekananAktif);
        const cocokQuery = !q || cNama.includes(q) || cSubkat.includes(q);

        if (cocokKat && cocokQuery) {
          // If searching or category is active, show all matching; otherwise respect expand toggle
          if (q || katRekananAktif !== 'semua' || isRekananExpanded || idx < 12) {
            card.classList.remove('hidden');
          } else {
            card.classList.add('hidden');
          }
          visibleCount++;
        } else {
          card.classList.add('hidden');
        }
      });

      // Filter Table
      tableRows.forEach(row => {
        const rKat = row.getAttribute('data-kat') || '';
        const rNama = row.getAttribute('data-nama') || '';
        const rSubkat = row.getAttribute('data-subkat') || '';

        const cocokKat = (katRekananAktif === 'semua' || rKat === katRekananAktif);
        const cocokQuery = !q || rNama.includes(q) || rSubkat.includes(q);

        if (cocokKat && cocokQuery) {
          row.style.display = '';
        } else {
          row.style.display = 'none';
        }
      });

      // Empty State
      const emptyState = document.getElementById('rekanan-empty-state');
      if (emptyState) {
        if (visibleCount === 0) {
          emptyState.classList.remove('hidden');
          if (expBar) expBar.classList.add('hidden');
        } else {
          emptyState.classList.add('hidden');
          if (expBar && modeTampilanRekanan === 'cards' && !q && katRekananAktif === 'semua') {
            expBar.classList.remove('hidden');
          } else if (expBar && (q || katRekananAktif !== 'semua')) {
            expBar.classList.add('hidden');
          }
        }
      }
    }

    // 5. Scroll Progress Bar & UI Scroll State (RAF Throttled for High Performance)
    let isScrollTicking = false;
    function handleScrollOptimized() {
      if (!isScrollTicking) {
        requestAnimationFrame(() => {
          const y = window.scrollY || document.documentElement.scrollTop;
          const header = document.getElementById('site-header');
          const backToTop = document.getElementById('back-to-top');
          header?.classList.toggle('is-scrolled', y > 24);
          backToTop?.classList.toggle('show', y > 520);

          const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
          const pb = document.getElementById('scroll-progress');
          if (pb && height > 0) {
            pb.style.width = ((y / height) * 100) + '%';
          }
          isScrollTicking = false;
        });
        isScrollTicking = true;
      }
    }
    window.addEventListener('scroll', handleScrollOptimized, { passive: true });

    // 6. Interaksi UI modern
    function tampilkanToast(pesan) {

      if (!toast) return;
      toast.textContent = pesan;

      clearTimeout(window.__nsrToastTimer);

    function initUIInteraktif() {
      const backToTop = document.getElementById('back-to-top');
      handleScrollOptimized();

      backToTop?.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

      // Tandai semua kartu utama sebagai interaktif tanpa layout thrashing
      document.querySelectorAll('section .bg-white.rounded-xl.border, section article.rounded-xl').forEach(card => {
        card.classList.add('interactive-card');
        card.addEventListener('pointerenter', () => {
          card._rect = card.getBoundingClientRect();
        }, { passive: true });
        card.addEventListener('pointermove', (e) => {
          const r = card._rect || card.getBoundingClientRect();
          card.style.setProperty('--mx', `${e.clientX - r.left}px`);
          card.style.setProperty('--my', `${e.clientY - r.top}px`);
        }, { passive: true });
      });

      // Filter layanan real-time.
      const serviceSearch = document.getElementById('service-search');
      const serviceClear = document.getElementById('service-clear');
      const resultCount = document.getElementById('service-result-count');
      const noResult = document.getElementById('service-no-result');
      const serviceItems = Array.from(document.querySelectorAll('#layanan .grid > div'));
      serviceItems.forEach(item => item.classList.add('service-item'));

      const filterServices = () => {
        let rawVal = (serviceSearch?.value || '').trim();
        let q = rawVal.toLocaleLowerCase('id-ID');
        // Bersihkan awalan '/' jika pengguna menekan / dari shortcut atau mengetik /
        if (q.startsWith('/')) {
          q = q.replace(/^\/+/, '').trim();
        }
        const terms = q.split(/\s+/).filter(Boolean);
        let visible = 0;

        serviceItems.forEach(item => {
          const text = item.textContent.toLocaleLowerCase('id-ID');
          const cocok = terms.length === 0 || terms.every(t => text.includes(t));
          item.classList.toggle('is-filtered-out', !cocok);
          if (cocok) visible++;
        });

        // Kontrol tampilan kelompok layanan agar rapi jika semua item di dalamnya terfilter
        document.querySelectorAll('#layanan .grid').forEach(grid => {
          const hasVisible = Array.from(grid.children).some(child => !child.classList.contains('is-filtered-out'));
          const groupWrapper = grid.parentElement;
          if (groupWrapper && groupWrapper.id !== 'layanan') {
            groupWrapper.style.display = hasVisible ? '' : 'none';
          }
        });

        if (resultCount) {
          resultCount.textContent = terms.length === 0 ? `${serviceItems.length} layanan tersedia` : `${visible} layanan ditemukan`;
        }
        serviceClear?.classList.toggle('hidden', !rawVal);
        noResult?.classList.toggle('hidden', visible !== 0);
      };

      serviceSearch?.addEventListener('input', filterServices);
      serviceSearch?.addEventListener('keydown', (e) => {
        if (e.key === '/' && serviceSearch.value.trim() === '') {
          e.preventDefault();
        }
      });
      serviceClear?.addEventListener('click', () => {
        serviceSearch.value = '';
        filterServices();
        serviceSearch.focus();
      });

      // Shortcut / untuk pencarian layanan, selama pengguna tidak sedang mengetik di field lain.
      document.addEventListener('keydown', (e) => {
        const tag = document.activeElement?.tagName?.toLowerCase();
        const sedangMengetik = ['input','textarea','select'].includes(tag) || document.activeElement?.isContentEditable;
        if (e.key === '/' && !sedangMengetik) {
          e.preventDefault();
          serviceSearch?.focus();
          serviceSearch?.select();
          serviceSearch?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        if (e.key === 'Escape') tutupModalTerbuka();
      });

      // Highlight menu sesuai section yang terlihat.
      const navLinks = Array.from(document.querySelectorAll('header nav a[href^="#"]'));
      const sectionMap = new Map(navLinks.map(a => [a.getAttribute('href').slice(1), a]));
      const observedSections = Array.from(sectionMap.keys()).map(id => document.getElementById(id)).filter(Boolean);
      if ('IntersectionObserver' in window) {
        const navObserver = new IntersectionObserver((entries) => {
          const active = entries.filter(e => e.isIntersecting).sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
          if (!active) return;
          navLinks.forEach(a => a.classList.remove('nav-active'));
          sectionMap.get(active.target.id)?.classList.add('nav-active');
        }, { rootMargin: '-32% 0px -58% 0px', threshold: [0, .15, .4] });
        observedSections.forEach(section => navObserver.observe(section));
      }

      // Counter statistik berjalan sekali ketika terlihat (Motion Spring physics).
      if (window.initAllCountUps) {
        window.initAllCountUps('.stat-number');
      } else {
        const stats = document.querySelectorAll('.stat-number');
        const animateStat = (el) => {
          if (el.dataset.animated === '1') return;
          el.dataset.animated = '1';
          const target = Number(el.dataset.to || el.dataset.count || 0);
          const suffix = el.dataset.suffix || '';
          const duration = 1100;
          const start = performance.now();
          const tick = (now) => {
            const p = Math.min((now - start) / duration, 1);
            const eased = 1 - Math.pow(1 - p, 3);
            el.textContent = `${Math.round(target * eased).toLocaleString('id-ID')}${suffix}`;
            if (p < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        };
        if ('IntersectionObserver' in window) {
          const statObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                animateStat(entry.target);
                observer.unobserve(entry.target);
              }
            });
          }, { threshold: .3 });
          stats.forEach(el => statObserver.observe(el));
        } else { stats.forEach(animateStat); }
      }
    }

    // 7. Visitor Counter (Real-Time Device Tracking & Auto-Sync)
    async function inisialisasiVisitorCounter() {
      const fallback = { total: 40, today: 1 };
      const elTotal = document.getElementById('visitor-total');
      const elToday = document.getElementById('visitor-today');

      let curTotal = fallback.total;
      let curToday = fallback.today;

      function formatNum(n) {
        return Number(n).toLocaleString('id-ID');
      }

      function animateValue(el, start, end, duration = 650) {
        if (!el || start === end) {
          if (el) el.textContent = formatNum(end);
          return;
        }
        const range = end - start;
        const startTime = performance.now();
        function update(now) {
          const progress = Math.min((now - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = Math.floor(start + range * eased);
          el.textContent = formatNum(current);
          if (progress < 1) requestAnimationFrame(update);
          else el.textContent = formatNum(end);
        }
        requestAnimationFrame(update);
      }

      const tampilkan = (data, animate = false) => {
        const nextTotal = Number(data.total ?? fallback.total);
        const nextToday = Number(data.today ?? fallback.today);
        if (animate && (nextTotal !== curTotal || nextToday !== curToday)) {
          animateValue(elTotal, curTotal, nextTotal);
          animateValue(elToday, curToday, nextToday);
        } else {
          if (elTotal) elTotal.textContent = formatNum(nextTotal);
          if (elToday) elToday.textContent = formatNum(nextToday);
        }
        curTotal = nextTotal;
        curToday = nextToday;
      };

      tampilkan(fallback, false);

      function getVisitorId() {
        try {
          let vid = localStorage.getItem('nsr_vid');
          if (!vid || !/^[a-f0-9\-]{16,80}$/i.test(vid)) {
            vid = (window.crypto && crypto.randomUUID) 
              ? crypto.randomUUID().replace(/-/g, '') 
              : (Math.random().toString(36).slice(2) + Date.now().toString(36));
            localStorage.setItem('nsr_vid', vid);
          }
          return vid;
        } catch (_) {
          return '';
        }
      }

      async function requestStats(isPoll = false) {
        const vid = getVisitorId();
        const params = new URLSearchParams();
        if (isPoll) params.set('poll', '1');
        if (vid) params.set('vid', vid);
        const query = '?' + params.toString();

        const isLocal = window.location.hostname === 'localhost' || 
                        window.location.hostname === '127.0.0.1' || 
                        window.location.protocol === 'file:';
        
        // Direct production sync on localhost/preview; relative with fallback on production domain
        const endpoints = isLocal
          ? ['https://kjppnanangrahayu.com/visitor-stats.php' + query]
          : [
              'visitor-stats.php' + query,
              '/visitor-stats.php' + query,
              'https://kjppnanangrahayu.com/visitor-stats.php' + query
            ];

        for (const ep of endpoints) {
          try {
            const response = await fetch(ep, {
              method: 'GET',
              headers: { 'Accept': 'application/json' },
              cache: 'no-store'
            });
            if (response.ok) {
              const data = await response.json();
              if (data && typeof data.total === 'number') return data;
            }
          } catch (e) {
            // try next endpoint
          }
        }
        return null;
      }

      // Initial visit hit
      try {
        const initialData = await requestStats(false);
        if (initialData) tampilkan(initialData, true);
      } catch (err) {
        console.debug('Visitor stats initial fallback:', err?.message || err);
      }

      // Real-time background sync polling every 60 seconds (only when tab is visible)
      setInterval(async () => {
        if (document.visibilityState !== 'visible') return;
        try {
          const liveData = await requestStats(true);
          if (liveData && (liveData.total !== curTotal || liveData.today !== curToday)) {
            tampilkan(liveData, true);
          }
        } catch (_) {}
      }, 60000);
    }
  </script>

    // Lazy load WebGL carousel hanya saat pengunjung scroll mendekati Galeri
    function setupCarouselLazy() {
      const carouselContainer = document.getElementById('galeri-flex-carousel');

        const observer = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting) {
            observer.disconnect();
            runCarouselInit();
          }
        }, { rootMargin: '350px 0px' });
        observer.observe(carouselContainer);
      } else {
        runCarouselInit();
      }
    }
